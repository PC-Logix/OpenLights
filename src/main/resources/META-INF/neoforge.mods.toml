modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neoforge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="opencomputers"
type="required"
versionRange="${opencomputers_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="veil"
type="optional"
versionRange="[2.0,)"
ordering="AFTER"
side="CLIENT"
