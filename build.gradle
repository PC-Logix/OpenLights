plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = project.mod_group_id
version = project.mod_version

base {
    archivesName = "OpenLights-MC${project.minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = uri('https://maven.michiyo.me/releases') }
    maven { url = uri('https://maven.kotori316.com') }
    maven { url = uri('https://maven.su5ed.dev/releases') }
}

neoForge {
    version = project.neoforge_version

    parchment {
        minecraftVersion = project.minecraft_version
        mappingsVersion = project.mapping_version
    }

    runs {
        configureEach {
            ideName = "OpenLights ${name.capitalize()}"
        }
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        openlights {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly "li.cil.oc:opencomputers:${project.opencomputers_version}"
    compileOnly "foundry.veil:veil-neoforge-1.21.1:${project.veil_version}"
    runtimeOnly "li.cil.oc:opencomputers:${project.opencomputers_version}"
    runtimeOnly("com.kotori316:scalablecatsforce-neoforge:${project.scala_loader_version}:with-library") {
        transitive = false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def resourceProperties = [
        mod_id: project.mod_id,
        mod_name: project.mod_name,
        mod_version: project.mod_version,
        mod_license: project.mod_license,
        mod_authors: project.mod_authors,
        mod_description: project.mod_description,
        loader_version_range: project.loader_version_range,
        minecraft_version_range: project.minecraft_version_range,
        neoforge_version_range: project.neoforge_version_range,
        opencomputers_version_range: project.opencomputers_version_range
]

tasks.named('processResources') {
    inputs.properties(resourceProperties)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(resourceProperties)
    }
}
